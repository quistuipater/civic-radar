services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boston_civic_radar}
      POSTGRES_USER: ${POSTGRES_USER:-civic_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_radar_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Offset from Ventura Civic Radar's 5432 and Santa Cruz's 5433 so all
      # three stacks can run on the same host at once.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Offset from Ventura's 11434 and Santa Cruz's 11435. Consider pointing
      # all three projects' OLLAMA_BASE_URL at one shared Ollama instance
      # instead of running three, to avoid duplicating multi-GB model
      # downloads.
      - "11436:11434"
    # Uncomment on a host with an NVIDIA GPU + nvidia-container-toolkit (e.g. madhatter):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://civic_radar:civic_radar_dev_password@postgres:5432/boston_civic_radar}
    volumes:
      - ./archive:/archive
      - ./backend:/app
    ports:
      # Offset from Ventura's 8010 and Santa Cruz's 8012 (8011 was already
      # taken by an unrelated container on this shared host).
      - "8013:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://civic_radar:civic_radar_dev_password@postgres:5432/boston_civic_radar}
    volumes:
      - ./archive:/archive
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.worker

volumes:
  postgres_data:
  ollama_data:
