services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boston_civic_radar}
      POSTGRES_USER: ${POSTGRES_USER:-civic_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_radar_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Offset from Ventura Civic Radar's 5432 and Santa Cruz's 5433 so all
      # three stacks can run on the same host at once.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Offset from Ventura's 11434 and Santa Cruz's 11435. Consider pointing
      # all three projects' OLLAMA_BASE_URL at one shared Ollama instance
      # instead of running three, to avoid duplicating multi-GB model
      # downloads.
      - "11436:11434"
    # Uncomment on a host with an NVIDIA GPU + nvidia-container-toolkit (e.g. madhatter):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: ../../core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://civic_radar:civic_radar_dev_password@postgres:5432/boston_civic_radar}
      PROJECT_NAME: Boston Civic Radar
      HTTP_USER_AGENT: BostonCivicRadar/0.1 (+local civic monitoring)
      OLLAMA_TRIAGE_MODEL: llama3.1:8b
      DASHBOARD_BASE_URL: http://madhatter.local:18013
    volumes:
      - ./archive:/archive
      - ../../core:/app
      - ./city_settings.py:/app/app/city_config.py
      - ./seed_sources.py:/app/scripts/seed_sources.py
      # See santa_cruz/docker-compose.yml's comment on this mount shape --
      # a fresh subdirectory, not individual files, so it nests under
      # /app/tests and inherits core/tests/conftest.py's fixtures.
      - ./tests:/app/tests/city
    ports:
      # 8013 was already taken by an unrelated container (notediscovery) on
      # this shared host; 18013 was free.
      - "18013:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ../../core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://civic_radar:civic_radar_dev_password@postgres:5432/boston_civic_radar}
      PROJECT_NAME: Boston Civic Radar
      HTTP_USER_AGENT: BostonCivicRadar/0.1 (+local civic monitoring)
      OLLAMA_TRIAGE_MODEL: llama3.1:8b
      DASHBOARD_BASE_URL: http://madhatter.local:18013
    volumes:
      - ./archive:/archive
      - ../../core:/app
      - ./city_settings.py:/app/app/city_config.py
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.worker

volumes:
  postgres_data:
  ollama_data:
