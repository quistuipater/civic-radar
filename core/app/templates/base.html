<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ project_name }}{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1417; --panel: #171e23; --border: #2a343b; --text: #e4e9ec;
      --muted: #8fa0aa; --accent: #4fb3d9; --level4: #d9534f; --level3: #e0a030;
      --level2: #4f8fd9; --level1: #5a6a72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
    }
    nav {
      display: flex; gap: 1.25rem; align-items: center; padding: 0.75rem 1.5rem;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    nav a { color: var(--text); text-decoration: none; font-weight: 500; }
    nav a:hover { color: var(--accent); }
    nav .brand { font-weight: 700; margin-right: 1rem; }
    .remote-inference-toggle {
      margin-left: auto; display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; color: var(--muted);
    }
    .switch { position: relative; display: inline-block; width: 34px; height: 19px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; cursor: pointer; inset: 0; background: var(--border);
      border-radius: 19px; transition: background 0.15s;
    }
    .switch .slider::before {
      content: ""; position: absolute; height: 15px; width: 15px; left: 2px; bottom: 2px;
      background: var(--text); border-radius: 50%; transition: transform 0.15s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(15px); }
    .switch input:disabled + .slider { opacity: 0.5; cursor: default; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    h1, h2, h3 { font-weight: 600; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    table { width: 100%; border-collapse: collapse; margin: 0.75rem 0 1.5rem; }
    th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:hover { background: rgba(255,255,255,0.03); }
    a.link { color: var(--accent); text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.78rem; font-weight: 600; }
    .level-4 { background: var(--level4); color: #fff; }
    .level-3 { background: var(--level3); color: #1a1200; }
    .level-2 { background: var(--level2); color: #fff; }
    .level-1 { background: var(--level1); color: #fff; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .stat { font-size: 1.8rem; font-weight: 700; }
    .stat-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    form.inline { display: inline; }
    input, textarea, select, button {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.9rem; font-family: inherit;
    }
    button { background: var(--accent); color: #04222c; font-weight: 600; cursor: pointer; border: none; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    label { display: block; margin: 0.6rem 0 0.2rem; color: var(--muted); font-size: 0.85rem; }
    .empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; }
    footer { padding: 2rem 1.5rem; color: var(--muted); font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">{{ project_name }}</span>
    <a href="/">Home</a>
    <a href="/documents">Documents</a>
    <a href="/digest">Daily Digest</a>
    <a href="/review-queue">Review Queue</a>
    <a href="/sources">Sources</a>
    <a href="/logs">Logs</a>
    <a href="/news">News</a>
    <a href="/issues">Issues</a>
    <a href="/organizations">Organizations</a>
    <a href="/summaries">Summaries</a>
    <a href="/manual-submissions/new">Submit Manual Item</a>
    <span class="remote-inference-toggle" title="When on, AI classification/extraction/summarization is sent to the Claude API instead of the local Ollama model. Falls back to local automatically if the remote call fails.">
      <label class="switch">
        <input type="checkbox" id="remote-inference-toggle" disabled>
        <span class="slider"></span>
      </label>
      <span id="remote-inference-label">Remote inference</span>
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Local-first civic intelligence — archive first, interpret second, publish third.</footer>
  <script>
    document.addEventListener('submit', function (e) {
      var btn = e.target.querySelector('button[type="submit"], button:not([type])');
      if (btn && !btn.disabled) {
        btn.textContent = 'Working…';
        btn.disabled = true;
      }
    });

    (function () {
      var toggle = document.getElementById('remote-inference-toggle');
      var label = document.getElementById('remote-inference-label');

      function setLabel(enabled) {
        label.textContent = 'Remote inference: ' + (enabled ? 'ON' : 'OFF');
      }

      fetch('/api/settings/remote-inference')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          toggle.checked = data.enabled;
          setLabel(data.enabled);
          toggle.disabled = false;
        })
        .catch(function () {
          label.textContent = 'Remote inference: unavailable';
        });

      toggle.addEventListener('change', function () {
        var enabled = toggle.checked;
        toggle.disabled = true;
        fetch('/api/settings/remote-inference', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: enabled }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            toggle.checked = data.enabled;
            setLabel(data.enabled);
          })
          .catch(function () {
            toggle.checked = !enabled; // revert on failure
          })
          .finally(function () {
            toggle.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
